      value: 172.22.0.0/16
      description: Set the source IP/CIDR seen by Zabbix for this collector.
    - macro: '{$COLLECTOR.NODATA}'
      value: 5m
      description: Must exceed the worst-case cycle duration plus the interval.
    - macro: '{$Q330.VOLTAGE.MIN}'
      value: '11'
      description: Minimum input voltage in V; adapt to installation.
    - macro: '{$Q330.TEMP.MAX}'
      value: '60'
      description: Maximum system temperature in Celsius.
    - macro: '{$Q330.CLOCK.MIN}'
      value: '90'
      description: Minimum clock quality percent.
    - macro: '{$Q330.SAT.MIN}'
      value: '4'
      description: Minimum satellites used.
    - macro: '{$Q330.MEDIA.MIN}'
      value: '10'
