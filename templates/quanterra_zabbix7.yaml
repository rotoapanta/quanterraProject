    template: Template Zabbix Trapper Quanterra
    name: Template Zabbix Trapper Quanterra
    groups:
    - name: Templates/Seismology
    items:
    - uuid: 187ceab183134d99bcae10a25b840eab
      name: Station code
      type: TRAP
      key: station.code
      delay: '0'
      history: 30d
      trends: '0'
      value_type: CHAR
      allowed_hosts: '{$COLLECTOR.ALLOWED_HOSTS}'
    - uuid: e18d826e7a6045ec9a39a35290b47f3e
      name: Tag serial number
      type: TRAP
      key: serial.number
      delay: '0'
      history: 30d
      trends: '0'
      value_type: CHAR
      allowed_hosts: '{$COLLECTOR.ALLOWED_HOSTS}'
    - uuid: 7f7c140208fe48608a62a520550c817f
      name: Q330 serial number
      type: TRAP
      key: q330.serial
      delay: '0'
      history: 30d
      trends: '0'
      value_type: CHAR
      allowed_hosts: '{$COLLECTOR.ALLOWED_HOSTS}'
