      name: Input voltage
      type: TRAP
      key: input.voltage
      delay: '0'
      history: 30d
      trends: 365d
      value_type: FLOAT
      allowed_hosts: '{$COLLECTOR.ALLOWED_HOSTS}'
      units: V
      triggers:
      - uuid: 6f013aa831db4b3caa2733c056739133
        expression: last(/Template Zabbix Trapper Quanterra/input.voltage)<{$Q330.VOLTAGE.MIN}
          and nodata(/Template Zabbix Trapper Quanterra/input.voltage,{$COLLECTOR.NODATA})=0
        name: 'Q330: Input voltage low'
        priority: WARNING
